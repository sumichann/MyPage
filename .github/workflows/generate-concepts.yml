name: Generate personal concept map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "data/note-feed.json"
      - "data/youtube-feed.json"
      - "data/web-search-feed.json"
      - "assets/audio/play-drum-*.mp3"
      - "assets/audio/research-*.mp3"
      - "assets/audio/turning_page.mp3"
      - "assets/audio/walk.mp3"
      - "scripts/generate_concepts.py"
      - "scripts/generate_map_music.py"
      - "scripts/concept_generator/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: concept-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate concepts with OpenAI
        run: python scripts/generate_concepts.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: sumichann

      - name: Generate map music
        run: python scripts/generate_map_music.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/concepts.json assets/audio/map-research.mp3 assets/audio/map-create.mp3 assets/audio/map-play.mp3 assets/audio/map-explore.mp3 assets/audio/map-reflect.mp3 assets/audio/map-walk.mp3; then
            echo "No concept changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/concepts.json assets/audio/map-research.mp3 assets/audio/map-create.mp3 assets/audio/map-play.mp3 assets/audio/map-explore.mp3 assets/audio/map-reflect.mp3 assets/audio/map-walk.mp3
          git commit -m "Update AI-generated concept map"
          git push
