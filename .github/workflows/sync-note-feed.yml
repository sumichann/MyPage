name: Sync note feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: note-feed-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch public note RSS feed
        run: python scripts/sync_note_feed.py
        env:
          NOTE_RSS_URL: https://note.com/chenchuchu/rss

      - name: Commit feed data
        id: commit
        run: |
          if git diff --quiet -- data/note-feed.json; then
            echo "No note feed changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/note-feed.json
          git commit -m "Update note RSS feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Generate concepts from the updated feed
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run generate-concepts.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
