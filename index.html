<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="公開された痕跡からAIが抽出した、kusahataを構成する言葉。"
    >
    <title>kusahata — words in progress</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <p class="site-name">kusahata.com</p>
      <p class="site-note">words in progress</p>
    </header>

    <main
      id="concept-field"
      class="concept-field"
      aria-label="kusahataを構成する言葉"
      aria-busy="true"
    >
      <p class="loading">collecting traces...</p>
    </main>

    <footer class="site-footer">
      <p id="concept-count">AI-generated concept map</p>
      <ul class="category-legend" aria-label="色とジャンルの対応">
        <li class="legend-item" data-category="identity">identity</li>
        <li class="legend-item" data-category="interest">interest</li>
        <li class="legend-item" data-category="project">project</li>
        <li class="legend-item" data-category="research">research</li>
        <li class="legend-item" data-category="tech-skill">tech skill</li>
        <li class="legend-item" data-category="tool">tool</li>
        <li class="legend-item" data-category="music">music</li>
        <li class="legend-item" data-category="books">books</li>
        <li class="legend-item" data-category="thought">thought</li>
      </ul>
      <a href="https://github.com/sumichann" rel="me">GitHub ↗</a>
    </footer>

    <noscript>このページの表示にはJavaScriptが必要です。</noscript>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
